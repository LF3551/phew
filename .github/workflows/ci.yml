name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS runners on GitHub can wait in the queue for a long time, so macOS runs
  # once a week and on demand instead of on every push.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      macos:
        description: Also check on macOS
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: node scripts/check-pty.mjs
      # The website builds and passes its checks, so a broken page never reaches the release.
      - if: matrix.os == 'ubuntu-latest'
        run: npm run site

  macos:
    name: Check on macos-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: node scripts/check-pty.mjs
