name: Release

# One click: Actions → Release → Run workflow.
#
# 1. Chooses the version: the version in package.json if it has no tag yet, otherwise the next patch,
#    minor, or major version.
# 2. Moves "Unreleased" in CHANGELOG.md to that version, runs all checks, and builds the VSIX.
# 3. Commits "chore: release x.y.z", tags vx.y.z, and pushes both.
# 4. Creates the GitHub release with the VSIX, a checksum, and the changelog section.
# 5. Publishes to the Visual Studio Marketplace and Open VSX with trusted publishing (OIDC): no tokens are
#    stored. Each store is skipped until its repository variable is "true":
#    PUBLISH_MARKETPLACE and PUBLISH_OPEN_VSX (Settings → Secrets and variables → Actions → Variables).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Next version when the current one is already released
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Check and build only. No commit, tag, release, or publishing.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version, check, and build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # A signed statement that this workflow built the .vsix from this commit (build provenance).
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Choose the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v${current}" >/dev/null; then
            npm version "${BUMP}" --no-git-tag-version >/dev/null
          fi
          version="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${version}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Update the changelog
        run: |
          node scripts/release-changelog.mjs "${{ steps.version.outputs.version }}"
          node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Check, build, and package
        run: |
          npm run package
          mv phew.vsix "phew-${{ steps.version.outputs.version }}.vsix"
          sha256sum "phew-${{ steps.version.outputs.version }}.vsix" > "phew-${{ steps.version.outputs.version }}.vsix.sha256"

      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: phew-${{ steps.version.outputs.version }}.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            phew-*.vsix
            phew-*.vsix.sha256
            release-notes.md
          if-no-files-found: error

      - name: Commit, tag, and push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -s -m "chore: release ${VERSION}"
          git tag -a "v${VERSION}" -m "Phew ${VERSION}"
          git push origin HEAD:main "v${VERSION}"

  github:
    name: GitHub release
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          prerelease=""
          # A version with a suffix, such as 1.2.0-beta.1, is a pre-release; every other version is a release.
          case "${VERSION}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v${VERSION}" "phew-${VERSION}.vsix" "phew-${VERSION}.vsix.sha256" \
            --repo "${GITHUB_REPOSITORY}" --title "Phew ${VERSION}" --notes-file release-notes.md \
            --verify-tag ${prerelease}

  marketplace:
    name: Visual Studio Marketplace
    needs: [prepare, github]
    if: ${{ !inputs.dry_run && vars.PUBLISH_MARKETPLACE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath "phew-${{ needs.prepare.outputs.version }}.vsix"

  open-vsx:
    name: Open VSX
    needs: [prepare, github]
    if: ${{ !inputs.dry_run && vars.PUBLISH_OPEN_VSX == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes ovsx@1.4.0 publish "phew-${{ needs.prepare.outputs.version }}.vsix" --trusted-publishing

  website:
    name: Website
    needs: [prepare, github]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # The release commit comes from the GITHUB_TOKEN, which starts no other workflow by itself;
      # the website asks for its build, so it shows the new version.
      - run: gh workflow run Website --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
