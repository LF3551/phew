name: Release

# Push a tag like v0.1.2 to publish. The tag must match the version in package.json,
# and CHANGELOG.md must have a section for it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the tag and the changelog
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
          node scripts/release-notes.mjs "${version}" > release-notes.md
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Check, build, and package
        run: |
          npm run package
          mv phew.vsix "phew-${VERSION}.vsix"
          sha256sum "phew-${VERSION}.vsix" > "phew-${VERSION}.vsix.sha256"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${VERSION}" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            "phew-${VERSION}.vsix" "phew-${VERSION}.vsix.sha256" \
            --title "Phew ${VERSION}" --notes-file release-notes.md --verify-tag ${prerelease}

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath "phew-${VERSION}.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.4.0 publish "phew-${VERSION}.vsix" --pat "${OVSX_PAT}"
