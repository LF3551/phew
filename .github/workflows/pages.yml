name: Website

# Builds the website from site/, docs/images, and resources, and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - resources/**
      - scripts/site.mjs
      - scripts/site-check.mjs
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The address of the website: a custom domain from the SITE_URL variable, or GitHub Pages.
      - run: node scripts/site.mjs --url "${SITE_URL:-https://lf3551.github.io/phew/}"
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      # Titles, descriptions, one h1, canonical URLs, JSON-LD, links, pictures, and the sitemap.
      - run: node scripts/site-check.mjs --url "${SITE_URL:-https://lf3551.github.io/phew/}"
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
