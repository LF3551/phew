name: Bug report
description: Report a problem in Phew.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: input
    id: phew
    attributes:
      label: Phew version or commit
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model provider and model
      placeholder: For example OpenAI gpt-4.1 or Ollama qwen2.5-coder
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets, tokens, and private code before you paste logs.
      render: text
